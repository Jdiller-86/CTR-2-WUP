site_name: CTR2WUP
site_description: Progress, original diagnostic builds and development contracts for the planned 3DS-to-Wii-U Windows injector.
site_url: https://jdiller-86.github.io/CTR-2-WUP-docs/
repo_url: https://github.com/Jdiller-86/CTR-2-WUP
repo_name: Jdiller-86/CTR-2-WUP
edit_uri: ''
docs_dir: artifacts/docs-site/source
site_dir: artifacts/docs-site/site
strict: true
use_directory_urls: true

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/gamepad-variant
    repo: fontawesome/brands/github
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - docs/stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Jdiller-86/CTR-2-WUP
      name: Project repository

nav:
  - Overview: index.md
  - Start here:
      - Repository tour: docs/repository-guide.md
      - Documentation: docs/index.md
      - Download and launch: docs/getting-started.md
      - Testing and evidence: docs/testing.md
      - Troubleshooting: docs/troubleshooting.md
      - Current limits: docs/compatibility.md
      - Progress: docs/progress.md
      - Milestone acceptance: docs/milestones.md
      - Remaining inputs: docs/current-roadblock.md
  - Guides:
      - Guided console tests: docs/guided-testing.md
      - GX Transfers: docs/gx-transfers.md
      - Save and result follow-up: docs/console-retest.md
      - RomFS assets: docs/romfs-assets.md
      - Local encrypted inputs: docs/encrypted-input.md
      - CIA intake: docs/cia-intake.md
      - Packaging: docs/packaging.md
      - Original compiled homebrew: docs/compiled-homebrew.md
      - Guest fixture: docs/guest-fixture.md
      - Windows builds: docs/build-windows.md
  - Runtime contracts:
      - Architecture: docs/architecture.md
      - CPU subset: docs/cpu-subset.md
      - CPU stack and transfers: docs/cpu-stack.md
      - AOT integration: docs/upstream-integration.md
      - Guest memory: docs/guest-memory.md
      - Guest threads: docs/guest-threads.md
      - Kernel objects: docs/kernel-objects.md
      - Shared services: docs/shared-services.md
      - HID input: docs/hid-input.md
      - GSP display: docs/gsp-display.md
      - GSP queues: docs/gsp-queues.md
      - Renderer status: docs/renderer-status.md
      - PICA command front end: docs/pica-commands.md
      - Vertex attributes: docs/vertex-attributes.md
      - First software scenes: docs/software-scenes.md
      - Compiled guest PICA draws: docs/guest-pica-draws.md
      - Filesystem and saves: docs/filesystem.md
  - Project:
      - Development tracking: docs/development-tracking.md
      - Project tracking policy: docs/github-project-overview.md
      - Current status: status.md
      - Product plan: docs/development-plan.md
      - GUI workflow: docs/gui-workflow.md
      - First game profile: docs/first-title.md
      - Original requirements: docs/project-brief.md
      - Dependency audit: docs/foundation-audit.md
      - Batch decryptor audit: docs/batch-decryptor-audit.md
      - Console evidence: docs/console-evidence.md
      - Physical-console checklist: docs/console-testing.md
  - Contribute:
      - Contributor guide: contributing.md
      - GitHub development: docs/github-development.md
      - Agent instructions: agent-instructions.md
      - Security: security.md
      - Changelog: changelog.md
      - Development history: docs/development-history.md
      - License: license.md
      - Third-party notices: third-party-notices.md
      - Site engine licenses: site-licenses.md
      - ARM CRT source notice: docs/licenses/devkitarm-crtls/README.md

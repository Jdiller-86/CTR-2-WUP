site_name: CTR2WUP
site_description: Usage and technical documentation for the CTR2WUP 3DS-to-Wii-U project.
site_url: https://jdiller-86.github.io/CTR-2-WUP/
repo_url: https://github.com/Jdiller-86/CTR-2-WUP
repo_name: Jdiller-86/CTR-2-WUP
edit_uri: ''
docs_dir: artifacts/docs-site/source
site_dir: artifacts/docs-site/site
strict: true
use_directory_urls: true

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/gamepad-variant
    repo: fontawesome/brands/github
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - docs/stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Jdiller-86/CTR-2-WUP
      name: Project repository

nav:
  - Overview: index.md
  - Usage:
      - Documentation: docs/index.md
      - Getting started: docs/getting-started.md
      - Compatibility: docs/compatibility.md
      - Encrypted inputs: docs/encrypted-input.md
      - Private executable intake: docs/cia-intake.md
      - Private asset samples: docs/private-asset-samples.md
      - WUP packaging: docs/packaging.md
      - Troubleshooting: docs/troubleshooting.md
  - Development:
      - Contributing: contributing.md
      - Windows builds: docs/build-windows.md
      - Testing: docs/testing.md
      - Architecture: docs/architecture.md
      - Wii U application protocol: docs/wiiu-platform.md
      - First-title target: docs/first-title.md
  - Runtime:
      - CPU and threads: docs/cpu.md
      - Guest memory: docs/guest-memory.md
      - Services and input: docs/services.md
      - Display and transfers: docs/graphics-transport.md
      - Controlled guest fixture: docs/guest-fixture.md
      - Compiled original homebrew: docs/compiled-homebrew.md
      - External AOT integration: docs/upstream-integration.md
      - PICA commands: docs/pica-commands.md
      - Vertex attributes: docs/vertex-attributes.md
      - Base textures: docs/textures.md
      - Software scenes: docs/software-scenes.md
      - Compiled guest draws: docs/guest-pica-draws.md
      - Filesystem and lifecycle: docs/filesystem.md
      - RomFS assets: docs/romfs-assets.md
      - Audio: docs/audio.md
  - Notices:
      - Security: security.md
      - License: license.md
      - Third-party notices: third-party-notices.md
      - Site engine licenses: site-licenses.md
      - ARM CRT source notice: docs/licenses/devkitarm-crtls/README.md

name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Keep games, keys, saves and credentials private. For vulnerabilities, use [SECURITY.md](https://github.com/Jdiller-86/CTR-2-WUP/blob/main/SECURITY.md).
  - type: input
    id: build
    attributes:
      label: Build and platform
      description: Version or download link; Windows/Linux version or Wii U environment.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Include what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or results
      description: Attach original diagnostic reports or a minimal error excerpt. Say if no report was saved.

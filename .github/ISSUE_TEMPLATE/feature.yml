name: Feature request
description: Propose a concrete improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check [plans.md](https://github.com/Jdiller-86/CTR-2-WUP/blob/main/plans.md) and existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed behavior
      description: What would this let a user or developer do?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How would we know it works?
      description: Describe an observable outcome. Link useful references or related issues.
    validations:
      required: true

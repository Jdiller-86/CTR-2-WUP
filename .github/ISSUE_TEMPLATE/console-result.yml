name: Wii U result
description: Return a requested hardware check or report where it stopped.
title: "[Console]: "
labels: [console-testing]
body:
  - type: markdown
    attributes:
      value: Follow the package's START-HERE guide. Attach only its results folder, with no games, keys or saves.
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Which requested checks passed, or where did it stop? Mention firmware/Aroma changes only if relevant.
    validations:
      required: true
  - type: textarea
    id: reports
    attributes:
      label: Results ZIP
      description: Attach the whole return folder named in the guide. Include partial failures; say if no files appeared.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build, if the logs are missing
      description: Package name or download link is enough.

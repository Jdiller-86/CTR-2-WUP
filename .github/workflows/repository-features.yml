name: Repository features
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-features
  cancel-in-progress: false
jobs:
  configure:
    if: github.repository == 'Jdiller-86/CTR-2-WUP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve immutable trusted main
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TRUSTED_SHA="$(gh api repos/Jdiller-86/CTR-2-WUP/commits/main --jq .sha)"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$TRUSTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Apply only requested free repository features
        env:
          GH_TOKEN: ${{ secrets.CTR2WUP_GITHUB_MANAGEMENT_TOKEN }}
        run: python tools/configure-github-repository.py --apply --output "$RUNNER_TEMP/repository-settings-receipt.json"
      - name: Retain reviewed operation receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-features-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-settings-receipt.json
          retention-days: 14
          if-no-files-found: warn

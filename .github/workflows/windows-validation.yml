name: Windows development validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows tools and fixtures
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Set up native GCC and Make
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
      - name: Run Windows host fixtures
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p artifacts/windows-validation
          python -m pip install '.[packaging,decryption]'
          make check-python PYTHON=python 2>&1 | tee artifacts/windows-validation/python-tests.log
      - name: Run all normal portable C suites on Windows
        if: ${{ !cancelled() && steps.msys.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p artifacts/windows-validation
          make check-c-portable 2>&1 | tee artifacts/windows-validation/portable-c-tests.log
      - name: Publish and validate the native Windows CIA helper
        shell: pwsh
        run: |
          $ctrCiaSdk = (dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $ctrCiaSdk -ne '10.0.403') { throw 'Unexpected .NET SDK' }
          dotnet --info | Tee-Object artifacts/windows-validation/dotnet-info.log
          $ctrCiaObj = (Join-Path $env:RUNNER_TEMP 'ctr2wup-cia-obj') + '/'
          $ctrCiaOutput = Join-Path $env:GITHUB_WORKSPACE 'artifacts/cia-helper/windows'
          dotnet publish tools/CiaIntake/CiaIntake.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            "-p:BaseIntermediateOutputPath=$ctrCiaObj" -o $ctrCiaOutput `
            2>&1 | Tee-Object artifacts/windows-validation/cia-helper-publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate-cia-helper.py --helper "$ctrCiaOutput/CTR2WUP-CIA-Intake.exe" `
            --output artifacts/reports/cia-helper-final
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package-cia-helper.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload the checked Windows CIA helper
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cia-helper-windows-${{ github.sha }}
          path: artifacts/delivery/*CIA-Intake*
          if-no-files-found: error
          retention-days: 14
      - name: Build pinned external generation tools
        shell: pwsh
        run: |
          & ./tools/install-translator-windows.ps1 2>&1 | Tee-Object artifacts/windows-validation/lifter-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute real ARM/Thumb/VFP lifter integration
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python tools/validate-upstream.py --service-api --heap-api --kernel-api \
            --hid-api --gsp-api --relay-api --fs-api --apt-api --thread-api --multiple-api \
            --output artifacts/windows-validation/upstream
          python -m host make-fixture --output "artifacts/windows-validation/Unicode fixture 日本語"
          python -m host run-fixture "artifacts/windows-validation/Unicode fixture 日本語/ctr2wup-guest.cxi" --backend upstream --output "artifacts/windows-validation/Unicode frames 日本語" > artifacts/windows-validation/upstream-unicode.log
      - name: Verify Windows WPF development capability
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'ctr2wup-wpf-toolchain-probe'
          dotnet new wpf --framework net10.0 --no-restore --output $probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $probe --configuration Release 2>&1 | Tee-Object artifacts/windows-validation/wpf-toolchain.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record validation scope
        if: always()
        shell: pwsh
        run: |
          @'
          ### Windows development validation

          This manual run checks the source CLI, original portable C fixtures, pinned
          external ARM/Thumb/VFP generation, Unicode paths, the self-contained CIA helper
          and a WPF SDK probe. A passing
          probe confirms development tooling; it does not implement or validate the final
          injector GUI, Wii U execution, WUP installation or commercial game compatibility.
          No ROM, user key, seed database, save or commercial asset is downloaded or uploaded.
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-development-validation-${{ github.sha }}
          include-hidden-files: true
          path: |
            artifacts/windows-validation/*.log
            artifacts/windows-validation/upstream/*.log
            artifacts/windows-validation/upstream/report.json
            artifacts/reports/cia-helper-final/report.json
            artifacts/delivery/cia-helper-manifest-*.json
            artifacts/logs/*.log
          if-no-files-found: warn
          retention-days: 14

# This validates tooling, host/C tests and the actual external AOT adapter. It does not implement
# or validate CTR2WUP's final GUI, Wii U hardware, installer acceptance or commercial games.
# Encrypted writer tests use original synthetic keys/certificates only.
# No ROM, key, save or user-supplied asset is used by this workflow.

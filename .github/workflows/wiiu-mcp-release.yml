name: Publish Wii U MCP starter kit

on:
  workflow_dispatch:
  push:
    tags:
      - 'wiiu-mcp-v*-alpha.*'

permissions:
  contents: read

concurrency:
  group: wiiu-mcp-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require an allowed source and clean checkout
        run: |
          python3 - <<'PY'
          import os, re, runpy
          version = runpy.run_path('tools/package-wiiu-mcp.py')['VERSION']
          ref = os.environ['GITHUB_REF']
          assert ref == 'refs/heads/main' or (
              re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+', version)
              and ref == 'refs/tags/wiiu-mcp-v'+version), 'Require main or the exact alpha tag'
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p artifacts/wiiu-mcp-release/logs
          printf 'CTR2WUP_SDK_ROOT=%s/ctr2wup-sdk\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install host tools and pinned runtime dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packaging/wiiu-mcp-requirements.lock
          python -m pip install '.[mcp-test,packaging]' build
      - name: Run host and release checks
        run: |
          set -euo pipefail
          make check-python PYTHON=python 2>&1 | tee artifacts/wiiu-mcp-release/logs/host-tests.log
          python -m unittest discover -s tests -p 'test_wiiu*.py' -v \
            2>&1 | tee artifacts/wiiu-mcp-release/logs/release-tests.log
      - name: Build original native diagnostic with the verified SDK
        run: |
          set -euo pipefail
          bash tools/install-wiiu-sdk.sh
          export DEVKITPRO="$CTR2WUP_SDK_ROOT" DEVKITPPC="$CTR2WUP_SDK_ROOT/devkitPPC"
          python -m host build --target prototype --output artifacts/wiiu-mcp-release/native \
            2>&1 | tee artifacts/wiiu-mcp-release/logs/native-build.log
      - name: Build and verify the paired Aroma control plugin
        run: |
          set -euo pipefail
          bash tools/build-wiiu-control.sh 2>&1 | tee artifacts/wiiu-mcp-release/logs/control-build.log
      - name: Build wheel and check its installed entry point
        run: |
          python -m build --wheel --outdir artifacts/wiiu-mcp-release/wheel
          python -m venv "$RUNNER_TEMP/mcp-wheel"
          "$RUNNER_TEMP/mcp-wheel/bin/python" -m pip install --no-deps artifacts/wiiu-mcp-release/wheel/*.whl
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/mcp-wheel/bin/ctr2wup-wiiu" --help) \
            > artifacts/wiiu-mcp-release/logs/wheel-smoke.log
      - name: Build strict documentation in its pinned environment
        run: |
          python -m venv "$RUNNER_TEMP/mcp-docs"
          "$RUNNER_TEMP/mcp-docs/bin/python" -m pip install -r docs-requirements.txt
          "$RUNNER_TEMP/mcp-docs/bin/python" tools/build-docs-site.py \
            > artifacts/wiiu-mcp-release/logs/docs-build.log 2>&1
      - name: Package pinned components, sources and verified host artifacts
        run: |
          python - <<'PY'
          import json, os, pathlib
          names = ['host-tests', 'release-tests', 'native-build', 'control-build', 'docs-build', 'wheel-smoke']
          root = pathlib.Path('artifacts/wiiu-mcp-release')
          assert all((root/'logs'/f'{name}.log').is_file() for name in names)
          (root/'evidence.json').write_text(json.dumps({'ok': True, 'source_commit': os.environ['GITHUB_SHA'],
              'checks': [{'name': name, 'exit_code': 0} for name in names]}, indent=2)+'\n')
          PY
          python tools/package-wiiu-mcp.py --wheel artifacts/wiiu-mcp-release/wheel/*.whl \
            --native artifacts/wiiu-mcp-release/native --control artifacts/wiiu-control/bundle \
            --sdk "$CTR2WUP_SDK_ROOT" \
            --evidence artifacts/wiiu-mcp-release/evidence.json --cache artifacts/wiiu-mcp-release/cache \
            --output artifacts/wiiu-mcp-release/publish
          python - <<'PY'
          import pathlib, runpy, subprocess, sys, zipfile
          root = pathlib.Path('artifacts/wiiu-mcp-release')
          archive, = (root/'publish').glob('*.zip')
          with zipfile.ZipFile(archive) as z:
              z.extractall(root/'smoke')
          subprocess.run([sys.executable, str(root/'smoke/setup.py'), '--verify-only'], check=True)
          installer = runpy.run_path(str(root/'smoke/setup.py'))
          report = installer['prepare']((root/'smoke').resolve(), '192.0.2.1')
          assert pathlib.Path(report['console_public_key']).stat().st_size == 32
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiiu-mcp-kit-${{ github.sha }}
          path: artifacts/wiiu-mcp-release/publish/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wiiu-mcp-logs-${{ github.sha }}
          path: artifacts/wiiu-mcp-release/logs/

  windows:
    name: Build and test the Windows installer
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wiiu-mcp-kit-${{ github.sha }}
          path: artifacts/wiiu-mcp-windows/base
      - name: Install pinned runtime and freezing tools
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packaging/wiiu-mcp-requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r packaging/wiiu-mcp-windows-build.txt '.[mcp-test]'
      - name: Freeze the bridge and guided desktop setup
        run: python tools/build-wiiu-mcp-windows.py --output artifacts/wiiu-mcp-windows/frozen
      - name: Package the self-contained Windows kit
        run: |
          $base = (Get-ChildItem artifacts/wiiu-mcp-windows/base -Filter '*.zip').FullName
          python tools/package-wiiu-mcp-windows.py --base "$base" --frozen artifacts/wiiu-mcp-windows/frozen --output artifacts/wiiu-mcp-windows/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from pathlib import Path; from zipfile import ZipFile; p,=Path('artifacts/wiiu-mcp-windows/publish').glob('*.zip'); ZipFile(p).extractall('artifacts/wiiu-mcp-windows/stage')"
      - name: Check real Windows GUI and frozen MCP operation without a Python installation
        run: |
          python tools/windows/test-wiiu-mcp-bundle.py --kit artifacts/wiiu-mcp-windows/stage --output artifacts/wiiu-mcp-windows/checks --emit-previews
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/wiiu-mcp-windows/checks/windows-check.json artifacts/wiiu-mcp-windows/publish/installer-checks.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiiu-mcp-windows-${{ github.sha }}
          path: artifacts/wiiu-mcp-windows/publish/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wiiu-mcp-installer-preview-${{ github.sha }}
          path: artifacts/wiiu-mcp-windows/checks/
          if-no-files-found: warn

  release:
    needs: [build, windows]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/wiiu-mcp-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wiiu-mcp-kit-${{ github.sha }}
          path: publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wiiu-mcp-windows-${{ github.sha }}
          path: publish
      - name: Publish immutable starter prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          root = pathlib.Path('publish')
          archives = list(root.glob('*.zip'))
          assert len(archives) == 2
          for archive in archives:
              windows = archive.name.endswith('-Windows-x64.zip')
              checksum = root/('SHA256SUMS-Windows-x64.txt' if windows else 'SHA256SUMS.txt')
              digest, name = checksum.read_text().strip().split('  ', 1)
              assert name == archive.name and hashlib.sha256(archive.read_bytes()).hexdigest() == digest
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None
                  manifest = json.loads(z.read('manifest.json'))
              assert manifest['source_commit'] == os.environ['GITHUB_SHA']
              assert manifest['python_runtime_bundled'] is windows
          ref_name = os.environ['GITHUB_REF']
          assert ref_name == 'refs/heads/main' or ref_name == 'refs/tags/wiiu-mcp-v'+manifest['version']
          checks = json.loads((root/'installer-checks.json').read_text())
          assert checks['ok'] and checks['frozen_bridge_handshake'] and checks['source_commit'] == os.environ['GITHUB_SHA']
          tag = 'wiiu-mcp-v' + manifest['version']
          existing = subprocess.run(['gh', 'release', 'view', tag], capture_output=True)
          assert existing.returncode != 0, 'Existing release preserved; choose a new kit version'
          ref = subprocess.run(['gh', 'api', 'repos/'+os.environ['GH_REPO']+'/git/ref/tags/'+tag], capture_output=True, text=True)
          if ref.returncode == 0:
              resolved = subprocess.check_output(['gh', 'api', 'repos/'+os.environ['GH_REPO']+'/commits/'+tag, '--jq', '.sha'], text=True).strip()
              assert resolved == manifest['source_commit'], 'Existing tag targets a different source; publication stopped'
          else:
              assert 'HTTP 404' in ref.stderr, 'Tag lookup failed; publication stopped'
          notes = root/'notes.txt'
          notes.write_text('Wii U MCP starter kit built from `'+manifest['source_commit']+'`.\n\n'
              'Windows: download the Windows-x64 ZIP, Extract All, and double-click Install Wii U MCP.exe. '
              'The three-step wizard installs the bridge, previews and backs up SD changes, and registers the bridge in local Codex. '
              'No Python installation, terminal commands or hand-edited configuration are required for the Windows kit. '
              'SD preparation and the Wii U IP can be completed later. Restart Codex after saving the connection.\n\n'
              'Other platforms: use the portable ZIP with Python 3.12+ and Internet for initial host dependency installation. '
              'Both kits include the original diagnostic WUHB, paired control plugin and ten pinned Aroma components with sources, licenses and checksums. '
              'Aroma must already be installed. Native rebuilds need a Git checkout and the verified SDK. '
              'Cloud connectivity needs a separately configured secure route. '
              'See START-HERE.txt for pairing. Physical-console validation is tracked in #192.\n', encoding='utf-8')
          assets = [str(path) for path in sorted(root.iterdir()) if path.name != 'notes.txt']
          subprocess.run(['gh', 'release', 'create', tag, '--target', manifest['source_commit'],
              '--draft', '--prerelease', '--latest=false', '--title', 'Wii U MCP starter kit '+manifest['version'],
              '--notes-file', str(notes), *assets], check=True)
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--prerelease', '--latest=false'], check=True)
          PY

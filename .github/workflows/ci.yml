name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Fork contributions receive no repository write access or project credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows with checksum-pinned actionlint
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/workflows "$RUNNER_TEMP/actionlint"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' \
            --output "$RUNNER_TEMP/actionlint/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/actionlint/actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/actionlint/actionlint.tar.gz" \
            --directory "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -color 2>&1 | tee artifacts/ci/workflows/actionlint.log
      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-lint-${{ github.sha }}
          path: artifacts/ci/workflows/*.log
          retention-days: 14
          if-no-files-found: warn

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.15']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared crypto and wheel build dependencies
        run: python -m pip install '.[packaging,decryption]' build
      - name: Run original offline host fixtures
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/python
          make check-python PYTHON=python 2>&1 | tee artifacts/ci/python/tests.log
      - name: Build wheel and test its installed entry point outside the checkout
        run: |
          set -euo pipefail
          python -m build --wheel --outdir artifacts/ci/python/dist 2>&1 | tee artifacts/ci/python/wheel-build.log
          python -m venv "$RUNNER_TEMP/ctr2wup-wheel"
          "$RUNNER_TEMP/ctr2wup-wheel/bin/python" -m pip install --no-deps artifacts/ci/python/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ctr2wup-wheel/bin/ctr2wup" --help
          "$RUNNER_TEMP/ctr2wup-wheel/bin/python" - <<'PY'
          import hashlib
          from importlib.resources import files
          from host.title_profile import BOOT_MOVIE_SHA256
          assert hashlib.sha256(files('host').joinpath('assets/bootMovie.h264').read_bytes()).hexdigest() == BOOT_MOVIE_SHA256
          PY
      - name: Upload wheel and host test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-python-${{ matrix.python }}-${{ github.sha }}
          path: |
            artifacts/ci/python/*.log
            artifacts/ci/python/dist/*.whl
            artifacts/logs/*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Stage standalone private sample helper
        if: matrix.python == '3.12'
        run: |
          mkdir -p artifacts/ci/asset-sample-tool
          cp tools/export-asset-samples.py artifacts/ci/asset-sample-tool/
          cp docs/private-asset-samples.md artifacts/ci/asset-sample-tool/README.md
          cp LICENSE artifacts/ci/asset-sample-tool/
      - name: Upload standalone private sample helper
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-asset-sample-tool-${{ github.sha }}
          path: artifacts/ci/asset-sample-tool/
          retention-days: 14
          if-no-files-found: error

  native:
    name: C ${{ matrix.cc }} and sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run all portable C fixtures with ASan and UBSan
        env:
          CC: ${{ matrix.cc }}
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/native
          "$CC" --version > artifacts/ci/native/compiler.log
          make check-c 2>&1 | tee artifacts/ci/native/tests.log
      - name: Compare original scenes with exact pixels and pinned shader encodings
        if: matrix.cc == 'gcc'
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/neobrain/nihstro.git artifacts/nihstro-reference
          git -C artifacts/nihstro-reference checkout --detach f4d8659decbfe5d234f04134b5002b82dc515a44
          python3 tools/validate-scenes.py --sanitize --nihstro-dir artifacts/nihstro-reference \
            --output artifacts/ci/scenes 2>&1 | tee artifacts/ci/native/scenes.log
      - name: Validate generated GX2 shaders against independent Latte decoding
        run: python3 tools/validate-gx2-shaders.py --cc "${{ matrix.cc }}" --sanitize --output artifacts/ci/gx2-shaders
      - name: Compare original texture and TEV scenes with exact rational pixels
        run: |
          artifacts/gx2-native-tests/native --fragment-programs > artifacts/ci/native/fragment-programs.json
          python3 tools/validate-textured-scenes.py --cc "${{ matrix.cc }}" --sanitize \
            --fragment-programs artifacts/ci/native/fragment-programs.json --output artifacts/ci/textured-scenes
      - name: Compare display cache work and exact output
        run: python3 tools/benchmark-display.py --cc "${{ matrix.cc }}" --output artifacts/ci/display-benchmark
      - name: Compare original DSP ADPCM samples with rational reference
        run: python3 tools/validate-dsp-adpcm.py --cc "${{ matrix.cc }}" --sanitize --output artifacts/ci/dsp-adpcm
      - name: Compare original CSTM blocks and seeks with rational reference
        run: python3 tools/validate-cstm.py --cc "${{ matrix.cc }}" --sanitize --output artifacts/ci/cstm
      - name: Compare complete original audio voices with rational reference
        run: python3 tools/validate-audio-engine.py --cc "${{ matrix.cc }}" --sanitize --output artifacts/ci/audio-engine
      - name: Upload portable C logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.cc }}-${{ github.sha }}
          path: |
            artifacts/ci/native/*.log
            artifacts/ci/native/fragment-programs.json
            artifacts/ci/gx2-shaders/report.json
            artifacts/ci/textured-scenes/report.json
            artifacts/ci/textured-scenes/*.commands
            artifacts/ci/textured-scenes/*.resources
            artifacts/ci/textured-scenes/*.texture
            artifacts/ci/textured-scenes/*.rgba
            artifacts/ci/display-benchmark/report.json
            artifacts/ci/dsp-adpcm/report.json
            artifacts/ci/dsp-adpcm/original-vectors.bin
            artifacts/ci/cstm/report.json
            artifacts/ci/cstm/original-streams.bin
            artifacts/ci/audio-engine/report.json
            artifacts/ci/audio-engine/original-vectors.bin
            artifacts/ci/audio-engine/*.wav
            artifacts/ci/scenes/*.json
            artifacts/ci/scenes/*.png
            artifacts/ci/scenes/*.rgba
            artifacts/ci/scenes/*.commands
            artifacts/ci/scenes/*.resources
            artifacts/ci/scenes/*.bin
          retention-days: 14
          if-no-files-found: warn

  windows:
    name: Windows host and portable C
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up native GCC, Make and independent OpenSSL
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
      - name: Run Windows host fixtures
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/windows
          python -m pip install '.[packaging,decryption]'
          python --version > artifacts/ci/windows/python-version.log
          make check-python PYTHON=python 2>&1 | tee artifacts/ci/windows/python-tests.log
      - name: Run all normal portable C suites on Windows
        if: ${{ !cancelled() && steps.msys.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/windows
          gcc --version > artifacts/ci/windows/compiler.log
          make check-c-portable 2>&1 | tee artifacts/ci/windows/portable-c-tests.log
      - name: Compare original DSP ADPCM samples on Windows
        if: ${{ !cancelled() && steps.msys.outcome == 'success' }}
        shell: msys2 {0}
        run: python tools/validate-dsp-adpcm.py --cc gcc --output artifacts/ci/windows/dsp-adpcm
      - name: Compare original CSTM blocks and seeks on Windows
        if: ${{ !cancelled() && steps.msys.outcome == 'success' }}
        shell: msys2 {0}
        run: python tools/validate-cstm.py --cc gcc --output artifacts/ci/windows/cstm
      - name: Compare complete original audio voices on Windows
        if: ${{ !cancelled() && steps.msys.outcome == 'success' }}
        shell: msys2 {0}
        run: python tools/validate-audio-engine.py --cc gcc --output artifacts/ci/windows/audio-engine
      - name: Upload Windows baseline logs
        # Original stream fixtures contain no commercial bytes or audio.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-baseline-${{ github.sha }}
          include-hidden-files: true
          path: |
            artifacts/ci/windows/*.log
            artifacts/ci/windows/dsp-adpcm/report.json
            artifacts/ci/windows/dsp-adpcm/original-vectors.bin
            artifacts/ci/windows/cstm/report.json
            artifacts/ci/windows/cstm/original-streams.bin
            artifacts/ci/windows/audio-engine/report.json
            artifacts/ci/windows/audio-engine/original-vectors.bin
            artifacts/ci/windows/audio-engine/*.wav
            artifacts/logs/*.log
          retention-days: 14
          if-no-files-found: warn

  wiiu:
    name: Wii U build and compiled guest draws
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Extract official immutable devkitPro SDK and build the native prototype
        env:
          CTR2WUP_SDK_ROOT: ${{ runner.temp }}/ctr2wup-sdk
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/sdk
          bash tools/install-wiiu-sdk.sh 2>&1 | tee artifacts/ci/sdk/install-build.log
          printf 'DEVKITPRO=%s\nDEVKITPPC=%s\n' "$CTR2WUP_SDK_ROOT" \
            "$CTR2WUP_SDK_ROOT/devkitPPC" >> "$GITHUB_ENV"
      - name: Publish structurally validated RPX and WUHB with provenance and notices
        run: |
          set -euo pipefail
          python -m host build --target prototype --output artifacts/ci/wiiu
          cp LICENSE THIRD_PARTY_NOTICES artifacts/ci/wiiu/
          cp "$DEVKITPRO/ctr2wup-image-digest.txt" artifacts/ci/wiiu/sdk-image-digest.txt
          cp -R "$DEVKITPRO/licenses" artifacts/ci/wiiu/sdk-licenses
          git rev-parse HEAD > artifacts/ci/wiiu/source-commit.txt
          (cd artifacts/ci/wiiu && sha256sum -- *.rpx *.wuhb > SHA256SUMS)
      - name: Build the focused original software Scene Check
        run: |
          set -euo pipefail
          python -m host build --target scene-check --output artifacts/ci/scene-check
          cp LICENSE THIRD_PARTY_NOTICES artifacts/ci/scene-check/
          mkdir -p artifacts/ci/scene-check/sd-card/wiiu/apps artifacts/ci/scene-check/rpx
          mv artifacts/ci/scene-check/*.wuhb artifacts/ci/scene-check/sd-card/wiiu/apps/
          mv artifacts/ci/scene-check/*.rpx artifacts/ci/scene-check/rpx/
          python - <<'PYGUIDE'
          import os
          from pathlib import Path
          from host import __version__
          guide = Path('tools/templates/scene-check.md').read_text()
          Path('artifacts/ci/scene-check/START-HERE.md').write_text(
              guide.replace('@VERSION@', __version__).replace('@SOURCE_COMMIT@', os.environ['GITHUB_SHA']))
          PYGUIDE
          cp "$DEVKITPRO/ctr2wup-image-digest.txt" artifacts/ci/scene-check/sdk-image-digest.txt
          cp -R "$DEVKITPRO/licenses" artifacts/ci/scene-check/sdk-licenses
          mkdir -p artifacts/ci/scene-check/images
          cp docs/images/software-scene.png artifacts/ci/scene-check/images/
          git rev-parse HEAD > artifacts/ci/scene-check/source-commit.txt
          (cd artifacts/ci/scene-check && sha256sum -- rpx/*.rpx sd-card/wiiu/apps/*.wuhb > SHA256SUMS)
      - name: Upload the focused Scene Check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiiu-scene-check-${{ github.sha }}
          path: artifacts/ci/scene-check/
          retention-days: 30
          if-no-files-found: error
      - name: Install the pinned original ARM fixture and generation dependencies
        env:
          CTR2WUP_SDK_ROOT: ${{ runner.temp }}/ctr2wup-sdk
        run: |
          set -euo pipefail
          bash tools/install-arm-fixtures.sh 2>&1 | tee artifacts/ci/sdk/arm-fixtures.log
          bash tools/install-translator.sh 2>&1 | tee artifacts/ci/sdk/translator.log
      - name: Execute and cross-build the original compiled guest draw program
        run: |
          set -euo pipefail
          python3 tools/validate-libctru.py --application draw --wiiu --gx2 --sanitize \
            --devkitarm "$DEVKITPRO/devkitARM" --output artifacts/ci/compiled-draw \
            2>&1 | tee artifacts/ci/sdk/compiled-draw.log
          mkdir -p artifacts/ci/guest-draws/images artifacts/ci/guest-draws/licenses artifacts/ci/guest-draws/rpx artifacts/ci/guest-draws/sd-card/wiiu/apps
          cp artifacts/ci/compiled-draw/report.json artifacts/ci/guest-draws/
          cp artifacts/ci/compiled-draw/draw/frame-*.ppm artifacts/ci/guest-draws/images/
          cp docs/images/guest-draw-*.png artifacts/ci/guest-draws/images/
          cp artifacts/ci/compiled-draw/draw/wiiu/*.rpx artifacts/ci/guest-draws/rpx/
          cp artifacts/ci/compiled-draw/draw/wiiu/*.wuhb artifacts/ci/guest-draws/sd-card/wiiu/apps/
          python - <<'PYGUIDE'
          import os
          from pathlib import Path
          from host import __version__
          guide = Path('tools/templates/guest-draws.md').read_text()
          Path('artifacts/ci/guest-draws/START-HERE.md').write_text(
              guide.replace('@VERSION@', __version__).replace('@SOURCE_COMMIT@', os.environ['GITHUB_SHA']))
          PYGUIDE
          cp LICENSE THIRD_PARTY_NOTICES artifacts/ci/guest-draws/
          cp docs/licenses/libctru.txt artifacts/ci/guest-draws/licenses/
          cp -R "$DEVKITPRO/licenses" artifacts/ci/guest-draws/licenses/sdk
          cp "$DEVKITPRO/ctr2wup-image-digest.txt" artifacts/ci/guest-draws/sdk-image-digest.txt
          git rev-parse HEAD > artifacts/ci/guest-draws/source-commit.txt
          (cd artifacts/ci/guest-draws && sha256sum -- rpx/*.rpx sd-card/wiiu/apps/*.wuhb > SHA256SUMS)
      - name: Stage the distinct compiled guest GX2 rendering profile
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/gx2-guest/images artifacts/ci/gx2-guest/licenses artifacts/ci/gx2-guest/rpx artifacts/ci/gx2-guest/sd-card/wiiu/apps
          cp artifacts/ci/compiled-draw/report.json artifacts/ci/gx2-guest/
          cp artifacts/ci/compiled-draw/gx2-shaders/report.json artifacts/ci/gx2-guest/shader-validation.json
          cp artifacts/ci/compiled-draw/draw/frame-*.ppm artifacts/ci/gx2-guest/images/
          cp docs/images/guest-draw-*.png artifacts/ci/gx2-guest/images/
          cp artifacts/ci/compiled-draw/draw/wiiu-gx2/*.rpx artifacts/ci/gx2-guest/rpx/
          cp artifacts/ci/compiled-draw/draw/wiiu-gx2/*.wuhb artifacts/ci/gx2-guest/sd-card/wiiu/apps/
          python - <<'PYGUIDE'
          import json, os
          from pathlib import Path
          from host import __version__
          stage = Path('artifacts/ci/gx2-guest')
          guide = Path('tools/templates/gx2-guest.md').read_text()
          (stage/'START-HERE.md').write_text(
              guide.replace('@VERSION@', __version__).replace('@SOURCE_COMMIT@', os.environ['GITHUB_SHA']))
          (stage/'profile.json').write_text(json.dumps({
              'version': __version__, 'source_commit': os.environ['GITHUB_SHA'],
              'application': 'CTR2WUP GX2 Guest', 'render_backend': 'gx2',
              'native_cross_build': True, 'reference_frames_backend': 'software',
              'gpu_hardware_verified': False, 'console_verified': False}, indent=2)+'\n')
          PYGUIDE
          cp LICENSE THIRD_PARTY_NOTICES artifacts/ci/gx2-guest/
          cp docs/licenses/libctru.txt artifacts/ci/gx2-guest/licenses/
          cp -R "$DEVKITPRO/licenses" artifacts/ci/gx2-guest/licenses/sdk
          cp "$DEVKITPRO/ctr2wup-image-digest.txt" artifacts/ci/gx2-guest/sdk-image-digest.txt
          git rev-parse HEAD > artifacts/ci/gx2-guest/source-commit.txt
          (cd artifacts/ci/gx2-guest && sha256sum -- rpx/*.rpx sd-card/wiiu/apps/*.wuhb > SHA256SUMS)
      - name: Upload the focused compiled GX2 Guest package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiiu-gx2-guest-${{ github.sha }}
          path: artifacts/ci/gx2-guest/
          retention-days: 30
          if-no-files-found: error
      - name: Execute and cross-build the original textured guest
        run: |
          set -euo pipefail
          python3 tools/validate-libctru.py --application textured --wiiu --gx2 --sanitize \
            --devkitarm "$DEVKITPRO/devkitARM" --output artifacts/ci/compiled-textured \
            2>&1 | tee artifacts/ci/sdk/compiled-textured.log
          mkdir -p artifacts/ci/textured-guest/images artifacts/ci/textured-guest/licenses artifacts/ci/textured-guest/rpx artifacts/ci/textured-guest/sd-card/wiiu/apps
          cp artifacts/ci/compiled-textured/report.json artifacts/ci/textured-guest/
          cp artifacts/ci/compiled-textured/gx2-shaders/report.json artifacts/ci/textured-guest/shader-validation.json
          cp artifacts/ci/compiled-textured/textured/frame-*.* artifacts/ci/textured-guest/images/
          cp artifacts/ci/compiled-textured/textured/wiiu-gx2/*.rpx artifacts/ci/textured-guest/rpx/
          cp artifacts/ci/compiled-textured/textured/wiiu-gx2/*.wuhb artifacts/ci/textured-guest/sd-card/wiiu/apps/
          python - <<'PYGUIDE'
          import json, os
          from pathlib import Path
          from host import __version__
          stage = Path('artifacts/ci/textured-guest')
          guide = Path('tools/templates/textured-guest.md').read_text()
          (stage/'START-HERE.md').write_text(
              guide.replace('@VERSION@', __version__).replace('@SOURCE_COMMIT@', os.environ['GITHUB_SHA']))
          (stage/'profile.json').write_text(json.dumps({
              'version': __version__, 'source_commit': os.environ['GITHUB_SHA'],
              'application': 'CTR2WUP Textured Guest', 'render_backend': 'gx2', 'textured': True,
              'native_cross_build': True, 'reference_frames_backend': 'software',
              'gpu_hardware_verified': False, 'console_verified': False}, indent=2)+'\n')
          PYGUIDE
          cp LICENSE THIRD_PARTY_NOTICES artifacts/ci/textured-guest/
          cp docs/licenses/libctru.txt artifacts/ci/textured-guest/licenses/
          cp -R "$DEVKITPRO/licenses" artifacts/ci/textured-guest/licenses/sdk
          cp "$DEVKITPRO/ctr2wup-image-digest.txt" artifacts/ci/textured-guest/sdk-image-digest.txt
          git rev-parse HEAD > artifacts/ci/textured-guest/source-commit.txt
          (cd artifacts/ci/textured-guest && sha256sum -- rpx/*.rpx sd-card/wiiu/apps/*.wuhb > SHA256SUMS)
      - name: Upload the focused compiled Textured Guest package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiiu-textured-guest-${{ github.sha }}
          path: artifacts/ci/textured-guest/
          retention-days: 30
          if-no-files-found: error
      - name: Build and verify the focused guest DSP runtime round
        run: |
          set -euo pipefail
          python -m host build --target guest-audio --output artifacts/ci/guest-audio
          python tools/validate-guest-dsp.py --cc gcc --sanitize --output artifacts/ci/guest-dsp-reference
          curl --fail --location --retry 3 https://github.com/wiiu-env/WiiUCrashLogDumper/releases/download/v0.1/WiiUCrashLogDumper_v0_1_Aroma.zip -o artifacts/ci/dumper.zip
          curl --fail --location --retry 3 https://codeload.github.com/wiiu-env/WiiUCrashLogDumper/zip/3bb31ca67a6b015cf79f6ef9397f4d039ae60192 -o artifacts/ci/dumper-source.zip
          python tools/package-runtime-round.py --app artifacts/ci/guest-audio \
            --reference artifacts/ci/guest-dsp-reference/report.json \
            --sdk-receipt "$DEVKITPRO/ctr2wup-image-digest.txt" --sdk-licenses "$DEVKITPRO/licenses" \
            --dumper artifacts/ci/dumper.zip --dumper-source artifacts/ci/dumper-source.zip \
            --output artifacts/ci/runtime-round
      - name: Upload the focused automatic runtime round
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiiu-runtime-round-${{ github.sha }}
          path: artifacts/ci/runtime-round/stage/
          retention-days: 30
          if-no-files-found: error
      - name: Build and independently verify the original Audio Streams diagnostic
        run: |
          set -euo pipefail
          python -m host build --target audio-stream-check --output artifacts/ci/audio-stream-check
          python3 tools/validate-audio-engine.py --cc gcc --sanitize --output artifacts/ci/audio-engine-native
          python3 tools/package-audio-round.py --app artifacts/ci/audio-stream-check \
            --reference-report artifacts/ci/audio-engine-native/report.json \
            --sdk-receipt "$DEVKITPRO/ctr2wup-image-digest.txt" \
            --sdk-licenses "$DEVKITPRO/licenses" --output artifacts/ci/audio-round
      - name: Upload the SD-ready guided Audio Streams round
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiiu-audio-round-${{ github.sha }}
          path: artifacts/ci/audio-round/stage/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Install the declared original-package signing dependency
        run: python -m pip install '.[packaging]'
      - name: Build the new installed-title path and focused FTP handoff
        run: |
          set -euo pipefail
          python -m host build --target install-check --output artifacts/ci/install-check
          python3 tools/package-install-candidate.py --native artifacts/ci/install-check --output artifacts/ci/install-candidate
          python3 tools/package-m1-suite.py --native artifacts/ci/install-check \
            --installed artifacts/ci/install-candidate \
            --capture-sdk "$DEVKITPRO" \
            --sdk-receipt "$DEVKITPRO/ctr2wup-image-digest.txt" \
            --sdk-licenses "$DEVKITPRO/licenses" --output artifacts/ci/m1-suite
      - name: Upload the focused installed-title check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiiu-install-check-${{ github.sha }}
          path: artifacts/ci/m1-suite/stage/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Build the fixed-package MCP error capture
        run: python3 tools/package-install-capture.py --output artifacts/ci/install-capture
      - name: Upload the focused installation error capture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiiu-install-capture-${{ github.sha }}
          path: artifacts/ci/install-capture/stage/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Upload checked compiled guest draws and source provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiiu-guest-draws-${{ github.sha }}
          path: artifacts/ci/guest-draws/
          retention-days: 30
          if-no-files-found: error
      - name: Explain the scope of the diagnostic build
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Wii U diagnostic build

          RPX/WUHB compilation and format validation do not establish console execution,
          WUP installer acceptance or commercial game compatibility. This is the original
          native diagnostic application. No ROM, user key, save or commercial asset is used.
          Download the `wiiu-prototype` artifact from this run for the build, checksums,
          source/SDK provenance and third-party notices.
          EOF
      - name: Upload diagnostic application and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiiu-prototype-${{ github.sha }}
          path: |
            artifacts/ci/sdk/*.log
            artifacts/ci/compiled-textured/*.log
            artifacts/ci/wiiu/
          retention-days: 30
          if-no-files-found: warn

  required:
    name: Required CI
    if: always()
    needs: [workflows, python, native, windows, wiiu]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every automatic check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          checks = json.loads(os.environ['CHECK_RESULTS'])
          failed = {name: check['result'] for name, check in checks.items() if check['result'] != 'success'}
          for name, check in checks.items():
              print(f"{name}: {check['result']}")
          if failed:
              raise SystemExit(f'CI checks did not all pass: {failed}')
          PY

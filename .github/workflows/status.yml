name: Work-item statuses

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  pull_request_target:
    types: [opened, reopened, closed, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_run:
    workflows: [CI, Documentation]
    types: [completed]
  workflow_dispatch:
    inputs:
      number:
        description: Optional issue/PR number; blank reconciles all work items
        type: string
        default: ''
      status:
        description: Explicit manual state for the numbered item; auto preserves issue choices
        type: choice
        default: auto
        options: [auto, planned, in_progress, awaiting_evidence, blocked, ready_for_review, done, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: work-item-status-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_branch || inputs.number || 'all' }}
  cancel-in-progress: false

jobs:
  statuses:
    name: Synchronize work-item statuses
    if: >-
      !((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        github.event.sender.type == 'Bot')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # privileged PR/workflow_run events execute only an immutable main commit.
      # Never check out a PR head, its merge ref, or workflow_run artifacts.
      - name: Resolve trusted main source
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          CTR_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TRUSTED_SHA="$(gh api "repos/$CTR_REPOSITORY/commits/main" --jq .sha)"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$TRUSTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Check out trusted API-only reconciler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - name: Reconcile exclusive labels and report branch checks
        env:
          GH_TOKEN: ${{ github.token }}
          CTR_REPOSITORY: ${{ github.repository }}
          CTR_EVENT_NAME: ${{ github.event_name }}
          CTR_NUMBER: ${{ inputs.number }}
          CTR_STATUS: ${{ inputs.status }}
        run: |
          set -euo pipefail
          args=(--repo "$CTR_REPOSITORY" --apply --output "$RUNNER_TEMP/github-status.json")
          if [[ "$CTR_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ -n "$CTR_NUMBER" ]]; then args+=(--number "$CTR_NUMBER"); fi
            if [[ "$CTR_STATUS" != auto && -n "$CTR_STATUS" ]]; then args+=(--status "$CTR_STATUS"); fi
          else
            args+=(--event "$GITHUB_EVENT_PATH")
          fi
          python3 tools/sync-github-status.py "${args[@]}"
      - name: Preserve work-item and branch status report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-status.json
          retention-days: 14
          if-no-files-found: error

name: Development traceability

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed feature catalog, native hierarchy and PR links
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: project-tracking-${{ github.repository }}
  cancel-in-progress: false

jobs:
  traceability:
    if: github.repository == 'Jdiller-86/CTR-2-WUP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve immutable trusted main
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CTR_TRUSTED_SHA="$(gh api repos/Jdiller-86/CTR-2-WUP/commits/main --jq .sha)"
          [[ "$CTR_TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$CTR_TRUSTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - name: Reconcile catalogued relationships
        env:
          GH_TOKEN: ${{ secrets.CTR2WUP_GITHUB_MANAGEMENT_TOKEN }}
          CTR_APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          CTR_ARGS=()
          if [[ "$CTR_APPLY" == 'true' ]]; then CTR_ARGS+=(--apply); fi
          python3 tools/reconcile-github-traceability.py "${CTR_ARGS[@]}" --output "$RUNNER_TEMP/traceability.json"
      - name: Retain private audit receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-traceability-${{ github.run_id }}
          path: ${{ runner.temp }}/traceability.json
          retention-days: 30
          if-no-files-found: error

name: Reviewed GitHub management

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed management operation on immutable trusted main
        type: choice
        options: [preflight, traceability, evidence, review, progress, overview, legacy-docs, archive-legacy, verify-sites]
        default: preflight
      apply:
        description: Apply only after inspecting the corresponding dry-run receipt
        type: boolean
        default: false
      review:
        description: Explicit reviewed status/resource plan
        type: choice
        options: [none, mario-input-received-v023, dsp-adpcm-foundation-v025, m1-install-prerequisite-v026]
        default: none

permissions:
  contents: read

concurrency:
  group: project-tracking-${{ github.repository }}
  cancel-in-progress: false

jobs:
  manage:
    if: github.repository == 'Jdiller-86/CTR-2-WUP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Resolve immutable trusted main
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CTR_TRUSTED_SHA="$(gh api repos/Jdiller-86/CTR-2-WUP/commits/main --jq .sha)"
          [[ "$CTR_TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$CTR_TRUSTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - name: Run fixed reviewed operation
        env:
          CTR2WUP_GITHUB_MANAGEMENT_TOKEN: ${{ secrets.CTR2WUP_GITHUB_MANAGEMENT_TOKEN }}
          CTR_OPERATION: ${{ inputs.operation }}
          CTR_APPLY: ${{ inputs.apply }}
          CTR_REVIEW: ${{ inputs.review }}
        run: |
          set -euo pipefail
          # Attach main without changing the immutable checked-out contents.
          git switch -c main
          CTR_ARGS=()
          if [[ "$CTR_APPLY" == true ]]; then CTR_ARGS+=(--apply); fi
          if [[ "$CTR_OPERATION" == review ]]; then CTR_ARGS+=(--review "$CTR_REVIEW"); fi
          python3 tools/manage-github.py "$CTR_OPERATION" "${CTR_ARGS[@]}" \
            --output artifacts/reviewed-management
      - name: Print public-safe operation receipts
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/reviewed-management')
          for name in ('access', 'receipt', 'traceability', 'review', 'project', 'legacy', 'sites'):
              path = root / (name + '.json')
              if path.is_file():
                  print(json.dumps({'receipt': name, 'data': json.loads(path.read_text())}))
          # Evidence descriptions are source-generated but need not be repeated in logs.
          path = root / 'evidence.json'
          if path.is_file():
              report = json.loads(path.read_text())
              print(json.dumps({'receipt': 'evidence', 'data': {key: report[key] for key in
                  ('ok', 'applied', 'tracker_count', 'work_item_count', 'writes_attempted', 'error') if key in report}}))
          path = root / 'overview.json'
          if path.is_file():
              report = json.loads(path.read_text())
              print(json.dumps({'receipt': 'overview', 'data': {key: report[key] for key in
                  ('ok', 'applied', 'enrichment_operations', 'completed_operations', 'managed_overview_verified', 'error', 'partial_changes') if key in report}}))
          PY
      - name: Retain receipts without command logs or Project notes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-management-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/reviewed-management/access.json
            artifacts/reviewed-management/receipt.json
            artifacts/reviewed-management/traceability.json
            artifacts/reviewed-management/evidence.json
            artifacts/reviewed-management/review.json
            artifacts/reviewed-management/project.json
            artifacts/reviewed-management/legacy.json
            artifacts/reviewed-management/sites.json
            artifacts/reviewed-management/overview.json
            artifacts/reviewed-management/progress/
          retention-days: 14
          if-no-files-found: error

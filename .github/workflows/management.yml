name: Simplify GitHub tracking

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed cleanup plan
        type: boolean
        default: false
      plan_sha256:
        description: Exact plan digest from a fresh dry run; required for apply
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: github-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  simplify:
    if: github.repository == 'Jdiller-86/CTR-2-WUP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve immutable trusted main
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CTR_TRUSTED_SHA="$(gh api repos/Jdiller-86/CTR-2-WUP/commits/main --jq .sha)"
          [[ "$CTR_TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$CTR_TRUSTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - name: Review or apply fixed cleanup
        env:
          GH_TOKEN: ${{ secrets.CTR2WUP_GITHUB_MANAGEMENT_TOKEN }}
          CTR_APPLY: ${{ inputs.apply }}
          CTR_PLAN: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          git switch -c main
          CTR_ARGS=()
          if [[ "$CTR_APPLY" == true ]]; then CTR_ARGS+=(--apply --plan-sha256 "$CTR_PLAN"); fi
          python3 tools/simplify-github.py "${CTR_ARGS[@]}" --output artifacts/github-cleanup.json
      - name: Retain public-safe cleanup receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-cleanup-${{ github.run_id }}
          path: artifacts/github-cleanup.json
          retention-days: 14
          if-no-files-found: error

name: Publish documentation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES'
      - 'pyproject.toml'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - 'tools/*docs*.py'
      - 'tools/project.py'
      - 'tools/project-dashboard.html'
      - '.github/workflows/publish-docs.yml'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Jdiller-86/CTR-2-WUP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve immutable trusted main
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CTR_TRUSTED_SHA="$(gh api repos/Jdiller-86/CTR-2-WUP/commits/main --jq .sha)"
          [[ "$CTR_TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$CTR_TRUSTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build and package checked documentation
        env:
          CTR_SOURCE_COMMIT: ${{ steps.trusted.outputs.sha }}
        run: |
          set -euo pipefail
          python -m pip install --requirement docs-requirements.txt
          python -m pip check
          python tools/build-docs-site.py
          python tools/package-docs-site.py
      - name: Read public Project and issue tracking
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CTR2WUP_GITHUB_MANAGEMENT_TOKEN || github.token }}
          CTR_SOURCE_COMMIT: ${{ steps.trusted.outputs.sha }}
        run: python tools/project.py snapshot --output artifacts/project.json --source-commit "$CTR_SOURCE_COMMIT"
      - name: Stage documentation and online project graph
        env:
          CTR_SOURCE_COMMIT: ${{ steps.trusted.outputs.sha }}
        run: |
          set -euo pipefail
          python tools/publish-docs-site.py --input artifacts/docs-publication \
            --source-commit "$CTR_SOURCE_COMMIT" --stage artifacts/pages-site \
            --project-snapshot artifacts/project.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/pages-site
      - name: Deploy canonical project site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify deployed documentation over HTTP
        run: python tools/verify-docs-site.py --with-project --output artifacts/pages-verification.json
      - name: Retain documentation receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/docs-publication/
            artifacts/docs-site/build-report.json
            artifacts/pages-verification.json
            artifacts/project.json
          retention-days: 14
          if-no-files-found: warn

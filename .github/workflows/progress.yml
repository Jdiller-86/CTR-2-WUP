name: Roadmap synchronization
on:
  push:
    branches: [main]
    paths: ['docs/milestone-status.json', 'tools/sync-github-progress.py', '.github/workflows/progress.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: roadmap-${{ github.repository }}
  cancel-in-progress: false
jobs:
  progress:
    name: Update milestone evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Synchronize managed tracker sections
        env:
          GH_TOKEN: ${{ github.token }}
          CTR_REPOSITORY: ${{ github.repository }}
        run: python tools/sync-github-progress.py --repo "$CTR_REPOSITORY" --apply --output artifacts/github-progress.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roadmap-${{ github.sha }}
          path: artifacts/github-progress.json
          retention-days: 14

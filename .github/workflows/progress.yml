name: Project tracking

on:
  push:
    branches: [main]
    paths:
      - 'docs/milestone-status.json'
      - 'tools/sync-github-progress.py'
      - 'tools/export-github-project.py'
      - 'tools/publish-project-progress.py'
      - 'tools/project-progress-dashboard.html'
      - '.github/workflows/progress.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap_project:
        description: Populate the selected existing Project before its first export; preserve manual values
        type: boolean
        default: false
      review_console_results:
        description: Record the reviewed named-TXT collection task as Done; never accept a full milestone
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: project-tracking-${{ github.repository }}
  cancel-in-progress: false

jobs:
  progress:
    name: Read Project authority and publish safe aggregates
    # No PR/issue payload or untrusted branch is ever executed with the token.
    if: github.repository == 'Jdiller-86/CTR-2-WUP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve immutable trusted main source
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          CTR_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TRUSTED_SHA="$(gh api "repos/$CTR_REPOSITORY/commits/main" --jq .sha)"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$TRUSTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Refresh managed evidence and criteria only
        env:
          GH_TOKEN: ${{ secrets.CTR2WUP_GITHUB_MANAGEMENT_TOKEN }}
          CTR_REPOSITORY: ${{ github.repository }}
        run: python tools/sync-github-progress.py --repo "$CTR_REPOSITORY" --apply --output "$RUNNER_TEMP/github-evidence.json"
      - name: Populate only the selected existing Project
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_project
        env:
          GH_TOKEN: ${{ secrets.CTR2WUP_GITHUB_MANAGEMENT_TOKEN }}
        run: python tools/flesh-github-project.py --apply --output "$RUNNER_TEMP/project-setup.json"
      - name: Review only the completed physical result-collection task
        if: github.event_name == 'workflow_dispatch' && inputs.review_console_results
        env:
          GH_TOKEN: ${{ secrets.CTR2WUP_GITHUB_MANAGEMENT_TOKEN }}
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('tracking', 'tools/export-github-project.py')
          tracking = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(tracking)
          source = json.loads(Path('docs/milestone-status.json').read_text())
          receipt = tracking.review_result_collection(tracking.GitHub(), source, apply=True)
          print(json.dumps(receipt))
          PY
      - name: Read live Project and mirror its status labels
        id: project
        env:
          GH_TOKEN: ${{ secrets.CTR2WUP_GITHUB_MANAGEMENT_TOKEN }}
        run: |
          set -uo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo '::warning::Configure the CTR2WUP_GITHUB_MANAGEMENT_TOKEN Actions secret with Project read/write, source Issues write and Actions dispatch access. Cloud-environment secrets are separate.'
          fi
          python tools/export-github-project.py --apply --output "$RUNNER_TEMP/project-progress" --report "$RUNNER_TEMP/project-receipt.json"
          RESULT=$?
          printf 'result=%s\n' "$RESULT" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Refresh the canonical project Pages site
        if: steps.project.outputs.result == '0'
        env:
          GH_TOKEN: ${{ secrets.CTR2WUP_GITHUB_MANAGEMENT_TOKEN }}
        run: python tools/publish-project-progress.py --input "$RUNNER_TEMP/project-progress" --apply
      - name: Retain operation receipts and safe dashboard assets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-tracking-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/github-evidence.json
            ${{ runner.temp }}/project-setup.json
            ${{ runner.temp }}/project-receipt.json
            ${{ runner.temp }}/project-progress/
          retention-days: 14
          if-no-files-found: error
      - name: Require current Project access
        if: steps.project.outputs.result != '0'
        run: |
          echo '::error::No current Project snapshot was published. Review the tracking receipt and secure Actions secret setup; prior public data will age visibly stale.'
          exit 1

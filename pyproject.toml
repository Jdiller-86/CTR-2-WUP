[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ctr2wup"
version = "0.27.0"
description = "Strict container inspection and real Wii U prototype build tools"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
packaging = ["cryptography>=50.0.2,<51"]
decryption = ["cryptography>=50.0.2,<51"]
mcp = ["mcp==2.3.0"]
mcp-test = ["mcp==2.3.0", "pyftpdlib==2.2.0"]

[project.scripts]
ctr2wup = "host.cli:main"
ctr2wup-wiiu = "host.wiiu_mcp:main"

[tool.setuptools]
packages = ["host", "translator", "renderer"]

[tool.setuptools.package-data]
host = ["assets/bootMovie.h264"]

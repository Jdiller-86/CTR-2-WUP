[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ctr2wup"
version = "0.3.0"
description = "Strict container inspection and real Wii U prototype build tools"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ctr2wup = "host.cli:main"

[tool.setuptools]
packages = ["host", "translator", "renderer"]
